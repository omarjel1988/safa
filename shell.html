<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبة الصفاء</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--p:#1F4E79;--p2:#2E6DA4;--j:#00695C;--j2:#13907F;--s:#6D2E5B;--s2:#9B4A85;--org:#EF6C00;--bd:#DCE3EB;--bg:#F1F4F8;--tx:#17212B;--mut:#637082;--red:#C62828;--grn:#2E7D32;
--c:#2B3A4A;--c2:#4A6480;--cl:#EDF1F6;--r:14px;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06)}
body[data-sec="p"]{--c:var(--p);--c2:var(--p2);--cl:#E6EFF8}
body[data-sec="j"]{--c:var(--j);--c2:var(--j2);--cl:#DFF2EF}
body[data-sec="s"]{--c:var(--s);--c2:var(--s2);--cl:#F4E8F1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15.5px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
header{background:var(--c);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 0;position:sticky;top:0;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.14)}
.hb{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto;padding-bottom:8px;min-height:48px}
.hb h1{font-size:19px;margin:0;flex:1;font-weight:800;display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb h1 i{flex:0 0 7px;height:24px;border-radius:4px;background:#FFB74D}
.hb button{background:rgba(255,255,255,.17);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700;min-height:38px}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:0 auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:rgba(255,255,255,.13);color:#fff;border-radius:10px;padding:7px 15px;font-size:14.5px;font-weight:700;min-height:40px}
nav button.on{background:#fff;color:var(--c);box-shadow:0 2px 6px rgba(0,0,0,.12)}
main{max-width:1100px;margin:0 auto;padding:16px 12px 120px}
main>*{animation:fi .2s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}
main h1{font-size:21px;margin:2px 0;font-weight:800;color:var(--c)}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{margin:0 0 12px;font-size:16.5px;color:var(--c);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
label,.f>span{font-size:13px;color:var(--mut);font-weight:700}
label small{font-weight:400}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;min-height:46px;width:100%;background:#F8FAFC;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--c);background:#fff;box-shadow:0 0 0 3px var(--cl)}
input[readonly]{background:var(--cl);color:var(--mut)}
.btn{background:var(--c);color:#fff;border:1.5px solid var(--c);border-radius:12px;padding:10px 18px;font-size:15.5px;font-weight:800;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.sec,.btn.ghost{background:#fff;color:var(--c)}
.btn.grn{background:var(--grn);border-color:var(--grn)}
.btn.sm{min-height:34px;padding:3px 11px;font-size:13.5px;font-weight:700;border-radius:9px}
.btn.warn{background:#fff;color:var(--red);border-color:var(--red)}
.btn.warn.arm{background:var(--red);color:#fff}
.btn:disabled{opacity:.55}
.x{background:none;border:0;color:var(--red);font-size:14px;padding:6px;font-weight:700}
.hide{display:none!important}
.hero{margin:4px 2px 16px}.hero h2{margin:0;font-size:24px;font-weight:800}.hero p{margin:2px 0 0;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{position:relative;overflow:hidden;border:0;border-radius:20px;padding:20px;color:#fff;text-align:right;min-height:175px;display:flex;flex-direction:column;gap:3px;box-shadow:0 8px 24px rgba(16,24,40,.15)}
.tile:active{transform:scale(.985)}
.tile.p{background:linear-gradient(135deg,var(--p),var(--p2))}.tile.j{background:linear-gradient(135deg,var(--j),var(--j2))}.tile.s{background:linear-gradient(135deg,var(--s),var(--s2))}
.tile svg{width:36px;height:36px;margin-bottom:6px}
.tile b{font-size:21px;font-weight:800}
.tile small{font-size:13.5px;opacity:.9}
.tile em{margin-top:auto;font-style:normal;font-weight:700;font-size:14px;background:rgba(255,255,255,.17);align-self:flex-start;padding:3px 12px;border-radius:99px}
.tile::after{content:"";position:absolute;left:-46px;bottom:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:0 0 14px}
.stat,.st{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px;box-shadow:var(--sh)}
.stat span,.st small{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.stat b,.st b{font-size:20px;font-variant-numeric:tabular-nums}
.stat.hi{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-color:transparent}.stat.hi span{color:rgba(255,255,255,.85)}
.neg{color:var(--red)}.pos{color:var(--grn)}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:30}
.bar .tot{font-size:14px;color:var(--mut)}.bar .tot b{display:block;font-size:20px;color:var(--tx)}
.bar .btn{flex:0 0 auto;min-width:150px}
.ltot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;color:var(--mut)}
.ltot b{color:var(--tx)}
.badge{display:inline-block;background:#FFF3E0;color:#B26A00;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{background:var(--cl);color:var(--c);padding:10px 8px;white-space:nowrap;font-weight:800}
td{padding:9px 8px;border-top:1px solid var(--bd);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:#FAFBFD}
td.l,th.l{text-align:right}td.num,th.num{text-align:left}td.wrapc{white-space:normal;min-width:180px;text-align:right}
tr.tot td,tfoot td{background:#FFF1DE!important;font-weight:800}
.detail td{background:var(--cl)!important}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:92%;display:none;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.ok{background:var(--grn)}#toast.err{background:var(--red)}
.pdf a,.lnk{display:inline-block;margin-top:10px;color:var(--c);font-weight:800}
.muted,.empty{color:var(--mut);text-align:center;padding:24px 12px}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.msg{padding:8px 12px;border-radius:10px;margin-top:10px;background:#FDECEA;color:var(--red);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.f{flex:1 1 150px}
.pg{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0}
.bars{display:grid;grid-template-columns:minmax(80px,170px) 1fr auto;gap:8px 12px;align-items:center}.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{background:var(--cl);border-radius:6px;height:18px;overflow:hidden}.bb{background:linear-gradient(90deg,var(--c2),var(--c));height:100%;border-radius:6px}.bb.n{background:var(--red)}.bv{font-variant-numeric:tabular-nums;font-weight:800;min-width:90px;text-align:left}
.big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;padding:3px 0}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--cl);border-top-color:var(--c);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-left:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:720px){.grid.l4{grid-template-columns:2fr 1fr 1fr 1fr}.grid.i5{grid-template-columns:2fr 1fr 1fr 1fr}}
@media print{header,.noprint,#toast,.bar,.card:has(.grid){display:none!important}body{background:#fff}.tw,.stat,.st,.card{box-shadow:none}}
</style>
</head>
<body data-sec="">
<header><div class="hb"><h1 onclick="go('home')"><i></i><span id="ttl">مكتبة الصفاء</span></h1>
<button onclick="refreshView()" title="تحديث البيانات">⟳ تحديث</button><button id="homeBtn" class="hide" onclick="go('home')">⌂ الرئيسية</button></div>
<nav id="tabs" class="hide"></nav></header>
<div id="toast"></div>
<main id="view"><div class="muted"><span class="spin"></span>جارٍ التحميل…</div></main>
<datalist id="dl-items"></datalist>
<datalist id="dl-sup"></datalist>

<script>
var B = null;                       // بيانات التشغيل من الملف
var CUR = 'home';
var SECTIONS = {
  p: { title: 'فواتير الشراء', tabs: [['inv', 'إدخال فاتورة'], ['psearch', 'بحث وتقارير'], ['plog', 'سجل المشتريات'], ['items', 'الأصناف'], ['sup', 'الموردين']] },
  j: { title: 'اليومية', tabs: [['jentry', 'إدخال اليومية'], ['daily', 'ملخص يومي'], ['jsearch', 'بحث وتقارير'], ['jlog', 'سجل اليومية']] },
  s: { title: 'قيود الموردين', tabs: [['sentry', 'إدخال قيد'], ['sstmt', 'كشف مورد'], ['ssum', 'ملخص الأرصدة'], ['slog', 'السجل'], ['ssup', 'الموردون'], ['saudit', 'سجل التعديلات']] }
};
var VIEW_SEC = { inv: 'p', psearch: 'p', plog: 'p', items: 'p', sup: 'p', jentry: 'j', daily: 'j', jsearch: 'j', jlog: 'j',
  sentry: 's', sstmt: 's', ssum: 's', slog: 's', ssup: 's', saudit: 's' };

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function en(v) {
  return String(v == null ? '' : v).replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 1632; })
    .replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 1776; }).replace(/٫/g, '.').replace(/٬/g, '').trim();
}
function num(v) { var n = parseFloat(en(v)); return isNaN(n) ? 0 : n; }
function fmt(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
var tt;
function toast(m, kind) {
  var t = $('#toast'); t.className = kind || ''; t.textContent = m; t.style.display = 'block';
  clearTimeout(tt); tt = setTimeout(function () { t.style.display = 'none'; }, 4200);
}
function errMsg(e) { return (e && e.message) ? String(e.message).replace(/^Error:\s*/, '') : String(e); }
function busy(btn, on) { if (btn) { btn.disabled = on; } }

/* ---------- التنقل ---------- */
function refreshView() {
  if (VIEW_SEC[CUR] === 's' || CUR === 'sup') { SUP.reload(); return; }
  reboot(function () { go(CUR); toast('تم تحديث البيانات', 'ok'); }).catch(function (e) { toast(errMsg(e), 'err'); });
}

function fillLists() {
  $('#dl-items').innerHTML = B.items.map(function (i) { return '<option value="' + esc(i.name) + '">'; }).join('');
  $('#dl-sup').innerHTML = B.suppliers.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('');
}
function reboot(cb) { return call('webBoot').then(function (b) { B = b; fillLists(); if (cb) cb(); }); }

/* ---------- الرئيسية ---------- */
var ICON = {
  p: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>',
  j: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 8h6M8 12h6M18 20a2 2 0 0 0 2-2V6"/></svg>',
  s: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14c2 .8 3 3 3 6"/></svg>'
};
function tile(k, to, title, desc, stat) {
  return '<button class="tile ' + k + '" onclick="go(\'' + to + '\')">' + ICON[k] + '<b>' + title + '</b><small>' + desc + '</small><em' + (k === 's' ? ' id="supHome"' : '') + '>' + stat + '</em></button>';
}
/* ---------- إدخال فاتورة ---------- */




/* ---------- أدوات الجداول ---------- */
function td(v, cls) { return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + v + '</td>'; }
function tbl(heads, rows, foot) {
  return '<div class="tw"><table><tr>' + heads.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>' + rows.join('') + (foot || '') + '</table></div>';
}
function pager(r, fn) {
  if (!r.off && !r.next) return '';
  return '<div class="pg"><button class="btn sec" ' + (r.off > 0 ? '' : 'disabled') + ' onclick="' + fn + '(' + Math.max(0, r.off - 100) + ')">السابق</button>' +
    '<span class="note">' + (r.off + 1) + ' – ' + (r.off + r.rows.length) + ' من ' + r.count + '</span>' +
    '<button class="btn sec" ' + (r.next ? '' : 'disabled') + ' onclick="' + fn + '(' + (r.off + 100) + ')">التالي</button></div>';
}
function runPdf(btn, kind, p) {
  busy(btn, true); $('#pdfo').innerHTML = '<span class="muted">جارٍ إنشاء الملف…</span>';
  call('webPdf', kind, p).then(function (r) {
    busy(btn, false);
    $('#pdfo').innerHTML = r.ok ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">فتح التقرير PDF ومشاركته ←</a>' : '';
    if (!r.ok) toast(r.msg, 'err');
  }).catch(function (e) { busy(btn, false); $('#pdfo').innerHTML = ''; toast(errMsg(e), 'err'); });
}
function pdfBox(kind, paramsFn) {
  return '<div class="pdf"><button class="btn sec" onclick="runPdf(this,\'' + kind + '\',' + paramsFn + ')">تصدير PDF</button><div id="pdfo"></div></div>';
}
function srcName(x) { return esc(x || ''); }

/* ---------- تعديل / حذف سطر فاتورة شراء ---------- */
var PR = {}, POFFX = 0;
function regPRows(rows) { PR = {}; rows.forEach(function (r) { PR[r.row] = r; }); }
function refreshP() { reboot(function () { if (CUR === 'psearch') doPSearch(POFFX); else if (CUR === 'plog') doPLog(POFFX); }); }
function editP(row) {
  var x = PR[row]; if (!x) return;
  var old = $('#pedit'); if (old) old.remove();
  var bx = document.createElement('div'); bx.id = 'pedit'; bx.className = 'card';
  bx.innerHTML = '<h2>تعديل سطر فاتورة</h2><div class="grid">' +
    '<div class="f wide"><label>اسم المورد</label><input id="pes" list="dl-sup" value="' + esc(x.sup) + '" autocomplete="off"></div>' +
    '<div class="f"><label>رقم الفاتورة</label><input id="pei" value="' + esc(x.inv) + '" autocomplete="off"></div>' +
    '<div class="f"><label>التاريخ</label><input id="ped" type="date" value="' + esc(x.date) + '"></div>' +
    '<div class="f wide"><label>الصنف</label><input id="pen" list="dl-items" value="' + esc(x.item) + '" autocomplete="off"></div>' +
    '<div class="f"><label>كود الصنف</label><input id="pec" value="' + esc(x.code) + '" autocomplete="off"></div>' +
    '<div class="f"><label>سعر الشراء</label><input id="pep" inputmode="decimal" value="' + x.price + '"></div>' +
    '<div class="f"><label>الكمية</label><input id="peq" inputmode="decimal" value="' + x.qty + '"></div>' +
    '<div class="f pnw hide"><label>الوحدة <span class="badge">صنف جديد</span></label><input id="peu" autocomplete="off"></div>' +
    '<div class="f pnw hide"><label>التصنيف <span class="badge">صنف جديد</span></label><input id="peg" autocomplete="off"></div></div>' +
    '<div class="note">الإجمالي = السعر × الكمية ويُحسب تلقائيًا. إن غيّرت الصنف إلى صنف مسجّل يظهر كوده، وإن كتبت صنفًا جديدًا يُسجَّل بكود تلقائي أو بالكود الذي تكتبه.</div><br>' +
    '<div class="row"><button class="btn grn" id="psv">حفظ التعديل</button><button class="btn sec" id="pcn">إلغاء</button>' +
    '<button class="btn" id="pdl" style="background:var(--red)">حذف السطر</button></div>';
  $('#view').insertBefore(bx, $('#view').firstChild);
  window.scrollTo(0, 0);
  var n = $('#pen', bx), c = $('#pec', bx);
  function onName() {
    var nm = n.value.trim().toLowerCase();
    var hit = B.items.filter(function (i) { return i.name.toLowerCase() === nm; })[0];
    if (hit) { c.value = hit.code; c.readOnly = true; $$('.pnw', bx).forEach(function (e) { e.classList.add('hide'); }); }
    else { if (c.readOnly) { c.value = ''; c.readOnly = false; } $$('.pnw', bx).forEach(function (e) { e.classList.toggle('hide', !nm); }); }
  }
  n.addEventListener('input', onName); n.addEventListener('change', onName);
  var orig = { sup: x.sup, inv: x.inv, date: x.date, item: x.item, price: x.price, qty: x.qty };
  $('#pcn').onclick = function () { bx.remove(); };
  $('#psv').onclick = function () {
    var b = this; busy(b, true);
    call('webPUpdate', { row: row, orig: orig, nw: { sup: $('#pes').value, inv: $('#pei').value, date: $('#ped').value, item: $('#pen').value, code: $('#pec').value,
      price: $('#pep').value, qty: $('#peq').value, unit: $('#peu').value, cat: $('#peg').value } }).then(function (r) {
      busy(b, false);
      if (!r.ok) { toast(r.msg, 'err'); return; }
      toast(r.msg, 'ok'); bx.remove(); refreshP();
    }).catch(function (e) { busy(b, false); toast(errMsg(e), 'err'); });
  };
  var armed = false;
  $('#pdl').onclick = function () {
    var b = this;
    if (!armed) { armed = true; b.textContent = 'تأكيد الحذف نهائيًا'; return; }
    busy(b, true);
    call('webPDelete', { row: row, orig: orig }).then(function (r) {
      busy(b, false);
      if (!r.ok) { toast(r.msg, 'err'); return; }
      toast(r.msg, 'ok'); bx.remove(); refreshP();
    }).catch(function (e) { busy(b, false); toast(errMsg(e), 'err'); });
  };
}

/* ---------- تعديل / حذف حركة يومية ---------- */
var JR = {}, JOFF = 0;
function regRows(rows) { JR = {}; rows.forEach(function (r) { JR[r.row] = r; }); }
function refreshJ() {
  if (CUR === 'jsearch') doJSearch(JOFF); else if (CUR === 'jlog') doJLog(JOFF);
}

/* ---------- بحث المشتريات (نفس أعمدة صفحة البحث) ---------- */
function doPSearch(off) {
  var q = $('#pq').value; POFFX = off || 0;
  $('#pres').innerHTML = '<div class="muted">جارٍ البحث…</div>';
  call('webSearchPurchases', q, off || 0).then(function (r) {
    var h = '<div class="stats"><div class="stat hi"><span>إجمالي النتائج</span><b>' + fmt(r.total) + '</b></div><div class="stat"><span>عدد الأسطر</span><b>' + r.count + '</b></div></div>';
    regPRows(r.rows);
    if (!r.rows.length) { $('#pres').innerHTML = h + '<div class="muted">لا توجد نتائج</div>'; return; }
    h += tbl(['المورد', 'رقم الفاتورة', 'التاريخ', 'كود الصنف', 'الصنف', 'سعر الشراء', 'الكمية', 'الإجمالي', 'تعديل'],
      r.rows.map(function (x) {

    if (hit && hit.last > 0 && p > 0) {
      var diff = (p * rate - hit.last) / hit.last * 100;
      var info = ' آخر سعر ' + fmt(hit.last) + (hit.lastSup ? ' من ' + esc(hit.lastSup) : '') + (hit.lastDate ? ' بتاريخ ' + esc(hit.lastDate) : '') + (hit.min > 0 && hit.min < hit.last ? ' · أقل سعر سابق ' + fmt(hit.min) : '');

        : '<b class="pos">⬇ أقل بنسبة ' + Math.abs(diff).toFixed(1) + '%</b> —' + info;

/* صورة الفاتورة: تصغير قبل الرفع لتسريع الإرسال من الآيباد */
function imgData(file) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
      };
      im.onerror = function () { rej(new Error('تعذّر قراءة الصورة')); };
      im.src = fr.result;
    };
    fr.onerror = function () { rej(new Error('تعذّر قراءة الملف')); };
    fr.readAsDataURL(file);
  });
}
function uploadPhoto(key, file) { return imgData(file).then(function (d) { return call('webInvAttach', { key: key, data: d }); }); }

/* ---------- الرسم البياني ---------- */
function chartSvg(labels, series) {
  var W = 700, H = 230, pb = 28, pt = 12, n = labels.length, g = series.length, max = 1, out = '';
  series.forEach(function (s) { s.v.forEach(function (x) { if (x > max) max = x; }); });
  var bw = W / n, w = Math.max(3, bw * 0.78 / g);
  for (var i = 0; i < n; i++) {
    series.forEach(function (s, j) {
      var h = Math.max(0, (H - pb - pt) * (s.v[i] / max)), x = i * bw + bw * 0.11 + j * w;
      out += '<rect x="' + x.toFixed(1) + '" y="' + (H - pb - h).toFixed(1) + '" width="' + Math.max(1, w - 1).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + s.c + '"><title>' + esc(s.n + ' — ' + labels[i] + ': ' + fmt(s.v[i])) + '</title></rect>';
    });
    out += '<text x="' + (i * bw + bw / 2).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="11" fill="#637082">' + esc(labels[i]) + '</text>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="direction:ltr;display:block" role="img"><line x1="0" x2="' + W + '" y1="' + (H - pb) + '" y2="' + (H - pb) + '" stroke="#DCE3EB"/>' + out + '</svg>' +
    '<div class="leg">' + series.map(function (s) { return '<span><i style="background:' + s.c + '"></i>' + esc(s.n) + '</span>'; }).join('') + '</div>';
}
var SER = function (rows) {
  return [{ n: 'المشتريات', c: '#2E6DA4', v: rows.map(function (m) { return m.p; }) }, { n: 'المقبوضات', c: '#13907F', v: rows.map(function (m) { return m.inn; }) }, { n: 'المدفوعات', c: '#EF6C00', v: rows.map(function (m) { return m.out; }) }];
};

  return '<div class="dn"><svg viewBox="0 0 190 190">' + s + '</svg><ul>' + items.map(function (x, i) {
    return '<li><i style="background:' + C[i % C.length] + '"></i><span>' + esc(x.n) + '</span><small dir="ltr">' + Math.round(x.v / tot * 100) + '%</small><b>' + fmt(x.v) + '</b></li>';
  }).join('') + '</ul></div>';
}
function dashCharts() {
  var d = DASH, c = document.getElementById('dch'); if (!c || !d) return;
  var daily = DMODE === 'd' && d.days;
  var lab = daily ? d.days.map(function (x, i) { return (i % 2 === 0 || d.days.length < 16) ? x.k : ''; }) : d.months.map(function (m) { return MN[+m.k.slice(5) - 1]; });
  var sum = function (a, f) { return a.reduce(function (t, x) { return t + x[f]; }, 0); }, rows = daily ? d.days : d.months;
  c.innerHTML = '<div class="chd"><h2>' + (daily ? 'هذا الشهر يومًا بيوم' : 'آخر 12 شهرًا') + '</h2><div class="seg"><button class="' + (daily ? 'on' : '') + '" onclick="DMODE=\'d\';dashCharts()">هذا الشهر</button>' +
    '<button class="' + (daily ? '' : 'on') + '" onclick="DMODE=\'m\';dashCharts()">12 شهرًا</button></div></div>' + chartSvg(lab, SER(rows)) +
    '<div class="note" style="margin-top:6px">المجموع: المشتريات ' + fmt(sum(rows, 'p')) + ' · المقبوضات ' + fmt(sum(rows, 'inn')) + ' · المدفوعات ' + fmt(sum(rows, 'out')) +
    ' · <b class="' + (sum(rows, 'inn') - sum(rows, 'out') < 0 ? 'neg' : '') + '">صافي النقد ' + fmt(sum(rows, 'inn') - sum(rows, 'out')) + '</b></div>';
}
renderDash = (function (orig) {
  return function () {
    orig();
    var d = DASH, box = document.getElementById('dash2'); if (!box || !d) return;
    var first = box.querySelector('.card'); if (first) { first.id = 'dch'; dashCharts(); }
    var h = '';
    if (d.cashEnd && d.cashEnd.length) h += '<div class="card" style="margin-top:16px"><div class="chd"><h2>رصيد الصندوق آخر كل شهر</h2><b class="' + (d.cash < 0 ? 'neg' : '') + '">الآن: ' + fmt(d.cash) + '</b></div>' +
      lineSvg(d.cashEnd.map(function (m) { return MN[+m.k.slice(5) - 1]; }), d.cashEnd.map(function (m) { return m.v; }), '#00695C') + '</div>';
    if (d.supShare && d.supShare.length) h += '<div class="card" style="margin-top:16px"><h2>توزيع المشتريات على الموردين — ' + d.year + '</h2>' + donutSvg(d.supShare) + '</div>';
    if (h && first) first.insertAdjacentHTML('afterend', h);
  };
})(renderDash);
